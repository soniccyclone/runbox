<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="runbox">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555E"/>
      <stop offset=".42" stop-color="#3C3C44"/>
      <stop offset=".52" stop-color="#2F2F36"/>
      <stop offset="1" stop-color="#23232A"/>
    </linearGradient>
  </defs>

  <!-- The chassis, as on the gallery: lit top edge, dark base. -->
  <rect x="2" y="6" width="60" height="52" rx="7" fill="url(#chassis)" stroke="#14141A"/>
  <rect x="2.5" y="6.5" width="59" height="51" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>

  <!-- Two runs, held side by side at the same frame. That is the whole idea,
       so it is the whole mark: slot A green, slot B amber. -->
  <rect x="8" y="14" width="22" height="22" rx="2.5" fill="#0A0B09" stroke="#0D0D11"/>
  <rect x="34" y="14" width="22" height="22" rx="2.5" fill="#0A0B09" stroke="#0D0D11"/>
  <rect x="8" y="14" width="22" height="3" rx="1.5" fill="#6BE3A8"/>
  <rect x="34" y="14" width="22" height="3" rx="1.5" fill="#FFC24D"/>

  <!-- Divergent arcs: the same tape, two different jumps. -->
  <path d="M11 33 Q19 20 27 33" fill="none" stroke="#6BE3A8" stroke-opacity=".85" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M37 33 Q45 24 53 33" fill="none" stroke="#FFC24D" stroke-opacity=".85" stroke-width="1.8" stroke-linecap="round"/>

  <!-- The transport groove, with the playhead locked to one frame for both. -->
  <rect x="8" y="43" width="48" height="7" rx="3.5" fill="#101014" stroke="#0A0A0E"/>
  <rect x="9.5" y="44.5" width="20" height="4" rx="2" fill="#FFB000" fill-opacity=".30"/>
  <rect x="28" y="41.5" width="3.5" height="10" rx="1.5" fill="#C4C4CC" stroke="#4A4A52" stroke-width=".6"/>
</svg>
